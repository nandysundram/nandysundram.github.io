<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f2d50"/>
    </linearGradient>
    <linearGradient id="temenosGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0061a4"/>
      <stop offset="100%" style="stop-color:#00a8cc"/>
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <filter id="blueGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="480" fill="url(#bankBg)"/>
  <!-- Subtle circuit pattern -->
  <g opacity="0.06" stroke="#00a8cc" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="200" y2="100"/><line x1="200" y1="100" x2="200" y2="200"/>
    <line x1="600" y1="80" x2="800" y2="80"/><line x1="600" y1="80" x2="600" y2="160"/>
    <line x1="0" y1="300" x2="150" y2="300"/><line x1="150" y1="300" x2="150" y2="400"/>
    <line x1="650" y1="350" x2="800" y2="350"/>
  </g>
  <!-- Temenos header banner -->
  <rect x="0" y="0" width="800" height="60" fill="url(#temenosGrad)"/>
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="22" font-family="Arial" font-weight="bold" letter-spacing="2">TEMENOS  |  CORE BANKING PLATFORM  |  AWS</text>
  <!-- Bank building icon area -->
  <rect x="55" y="80" width="150" height="220" rx="10" fill="#0a2040" stroke="#00a8cc" stroke-width="1.5"/>
  <text x="130" y="120" text-anchor="middle" fill="#00a8cc" font-size="40">🏦</text>
  <text x="130" y="155" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">Core Banking</text>
  <text x="130" y="172" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Arial">T24 / Transact</text>
  <line x1="70" y1="185" x2="190" y2="185" stroke="#00a8cc" stroke-width="1" opacity="0.5"/>
  <text x="130" y="205" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">Deposits</text>
  <text x="130" y="220" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">Loans</text>
  <text x="130" y="235" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">Payments</text>
  <text x="130" y="250" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">Trade Finance</text>
  <text x="130" y="265" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">Reporting</text>
  <!-- Arrow -->
  <line x1="205" y1="190" x2="240" y2="190" stroke="#00a8cc" stroke-width="2"/>
  <polygon points="240,185 252,190 240,195" fill="#00a8cc"/>
  <!-- AWS Architecture panel -->
  <rect x="252" y="80" width="498" height="310" rx="12" fill="#081828" stroke="#0061a4" stroke-width="1.5"/>
  <text x="500" y="105" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="Arial" font-weight="bold">AWS CLOUD ARCHITECTURE</text>
  <!-- VPC box -->
  <rect x="268" y="115" width="466" height="260" rx="8" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="290" y="132" fill="#3b82f6" font-size="10" font-family="Arial">VPC</text>
  <!-- EKS -->
  <rect x="282" y="140" width="130" height="60" rx="8" fill="#0d3b6e"/>
  <text x="347" y="165" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">EKS Cluster</text>
  <text x="347" y="182" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">Temenos Containers</text>
  <!-- RDS -->
  <rect x="430" y="140" width="130" height="60" rx="8" fill="#0d3b6e"/>
  <text x="495" y="165" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">RDS Postgres</text>
  <text x="495" y="182" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">Multi-AZ + Aurora</text>
  <!-- ALB -->
  <rect x="580" y="140" width="130" height="60" rx="8" fill="#0d3b6e"/>
  <text x="645" y="165" text-anchor="middle" fill="white" font-size="11" font-family="Arial" font-weight="bold">ALB + WAF</text>
  <text x="645" y="182" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="Arial">SSL Termination</text>
  <!-- Connection lines between boxes -->
  <line x1="412" y1="170" x2="430" y2="170" stroke="#00a8cc" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="170" x2="580" y2="170" stroke="#00a8cc" stroke-width="1.5"/>
  <!-- Lower row -->
  <rect x="282" y="222" width="100" height="50" rx="8" fill="#0d3b6e"/>
  <text x="332" y="248" text-anchor="middle" fill="white" font-size="10" font-family="Arial" font-weight="bold">S3 Buckets</text>
  <text x="332" y="262" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="Arial">Logs &amp; Backups</text>
  <rect x="395" y="222" width="100" height="50" rx="8" fill="#0d3b6e"/>
  <text x="445" y="248" text-anchor="middle" fill="white" font-size="10" font-family="Arial" font-weight="bold">CloudWatch</text>
  <text x="445" y="262" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="Arial">Monitoring</text>
  <rect x="508" y="222" width="100" height="50" rx="8" fill="#0d3b6e"/>
  <text x="558" y="248" text-anchor="middle" fill="white" font-size="10" font-family="Arial" font-weight="bold">IAM + KMS</text>
  <text x="558" y="262" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="Arial">Security</text>
  <rect x="621" y="222" width="100" height="50" rx="8" fill="#0d3b6e"/>
  <text x="671" y="248" text-anchor="middle" fill="white" font-size="10" font-family="Arial" font-weight="bold">Route 53</text>
  <text x="671" y="262" text-anchor="middle" fill="#93c5fd" font-size="8" font-family="Arial">DNS + Failover</text>
  <!-- Compliance badges -->
  <rect x="282" y="290" width="85" height="26" rx="13" fill="#16a34a" opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="324" y="308" text-anchor="middle" fill="#22c55e" font-size="10" font-family="Arial">PCI-DSS</text>
  <rect x="378" y="290" width="85" height="26" rx="13" fill="#16a34a" opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="420" y="308" text-anchor="middle" fill="#22c55e" font-size="10" font-family="Arial">SOC 2</text>
  <rect x="474" y="290" width="85" height="26" rx="13" fill="#16a34a" opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="516" y="308" text-anchor="middle" fill="#22c55e" font-size="10" font-family="Arial">ISO 27001</text>
  <rect x="570" y="290" width="100" height="26" rx="13" fill="#16a34a" opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="620" y="308" text-anchor="middle" fill="#22c55e" font-size="10" font-family="Arial">High Availability</text>
  <rect x="282" y="325" width="85" height="26" rx="13" fill="#0061a4" opacity="0.3" stroke="#00a8cc" stroke-width="1"/>
  <text x="324" y="343" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Arial">Terraform IaC</text>
  <rect x="378" y="325" width="85" height="26" rx="13" fill="#0061a4" opacity="0.3" stroke="#00a8cc" stroke-width="1"/>
  <text x="420" y="343" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Arial">CI/CD Pipeline</text>
  <rect x="474" y="325" width="85" height="26" rx="13" fill="#0061a4" opacity="0.3" stroke="#00a8cc" stroke-width="1"/>
  <text x="516" y="343" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Arial">Auto Scaling</text>
  <rect x="570" y="325" width="100" height="26" rx="13" fill="#0061a4" opacity="0.3" stroke="#00a8cc" stroke-width="1"/>
  <text x="620" y="343" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Arial">Disaster Recovery</text>
  <!-- Footer -->
  <text x="400" y="420" text-anchor="middle" fill="#38bdf8" font-size="16" font-family="Arial" font-weight="bold" filter="url(#blueGlow)">Banking Project — Temenos on AWS</text>
  <text x="400" y="441" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Arial">Core Banking · EKS · RDS · High Availability · PCI-DSS · Terraform</text>
  <text x="400" y="462" text-anchor="middle" fill="#1e3a5f" font-size="11" font-family="Arial">BahwanCyberTek · AWS Cloud Infrastructure · Financial Compliance</text>
</svg>
