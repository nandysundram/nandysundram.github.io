<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a2a"/>
      <stop offset="100%" style="stop-color:#1a0a3d"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <filter id="purpleGlow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="480" fill="url(#cloudBg)"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="58" fill="url(#purpleAccent)"/>
  <text x="400" y="38" text-anchor="middle" fill="white" font-size="20" font-family="Arial" font-weight="bold" letter-spacing="2">CLOUD ENGINEERING — ROLES &amp; RESPONSIBILITIES</text>
  <!-- AWS Pillars in grid -->
  <!-- Infrastructure -->
  <rect x="30" y="75" width="170" height="110" rx="10" fill="#1e0d45" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="115" y="100" text-anchor="middle" fill="#a78bfa" font-size="13" font-family="Arial" font-weight="bold">Infrastructure</text>
  <text x="115" y="118" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">EC2 · ECS · EKS</text>
  <text x="115" y="133" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Auto Scaling Groups</text>
  <text x="115" y="148" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">VPC · Subnets · SGs</text>
  <text x="115" y="163" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Load Balancers</text>
  <!-- DevOps / CI-CD -->
  <rect x="215" y="75" width="170" height="110" rx="10" fill="#1e0d45" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" fill="#a78bfa" font-size="13" font-family="Arial" font-weight="bold">DevOps / CI-CD</text>
  <text x="300" y="118" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Jenkins · CodeBuild</text>
  <text x="300" y="133" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">CodeDeploy · Pipeline</text>
  <text x="300" y="148" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Terraform · Ansible</text>
  <text x="300" y="163" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Git · JFrog · ECR</text>
  <!-- Security -->
  <rect x="400" y="75" width="170" height="110" rx="10" fill="#1e0d45" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="485" y="100" text-anchor="middle" fill="#a78bfa" font-size="13" font-family="Arial" font-weight="bold">Security</text>
  <text x="485" y="118" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">IAM · KMS · Secrets</text>
  <text x="485" y="133" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">WAF · Shield · GuardDuty</text>
  <text x="485" y="148" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Certificate Manager</text>
  <text x="485" y="163" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Pen Testing · Compliance</text>
  <!-- Monitoring -->
  <rect x="585" y="75" width="185" height="110" rx="10" fill="#1e0d45" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="677" y="100" text-anchor="middle" fill="#a78bfa" font-size="13" font-family="Arial" font-weight="bold">Monitoring</text>
  <text x="677" y="118" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">CloudWatch · New Relic</text>
  <text x="677" y="133" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Grafana · Kibana</text>
  <text x="677" y="148" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">Alarms · Log Groups</text>
  <text x="677" y="163" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Arial">CheckMK · Cloudflare</text>
  <!-- Second row -->
  <!-- Containers -->
  <rect x="30" y="205" width="170" height="110" rx="10" fill="#1e0d45" stroke="#f97316" stroke-width="1.5"/>
  <text x="115" y="230" text-anchor="middle" fill="#fb923c" font-size="13" font-family="Arial" font-weight="bold">Containers</text>
  <text x="115" y="248" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">Docker · ECR</text>
  <text x="115" y="263" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">ECS Fargate</text>
  <text x="115" y="278" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">EKS · Kubernetes</text>
  <text x="115" y="293" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">Container Orchestration</text>
  <!-- Databases -->
  <rect x="215" y="205" width="170" height="110" rx="10" fill="#1e0d45" stroke="#f97316" stroke-width="1.5"/>
  <text x="300" y="230" text-anchor="middle" fill="#fb923c" font-size="13" font-family="Arial" font-weight="bold">Databases</text>
  <text x="300" y="248" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">RDS · Aurora</text>
  <text x="300" y="263" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">PostgreSQL · MySQL</text>
  <text x="300" y="278" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">MSSQL · Redis</text>
  <text x="300" y="293" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">Backup &amp; Recovery</text>
  <!-- Networking -->
  <rect x="400" y="205" width="170" height="110" rx="10" fill="#1e0d45" stroke="#f97316" stroke-width="1.5"/>
  <text x="485" y="230" text-anchor="middle" fill="#fb923c" font-size="13" font-family="Arial" font-weight="bold">Networking</text>
  <text x="485" y="248" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">VPC · Subnets · ACLs</text>
  <text x="485" y="263" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">VPN · Transit Gateway</text>
  <text x="485" y="278" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">Route 53 · ALB / NLB</text>
  <text x="485" y="293" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">NAT · IG Gateway</text>
  <!-- AI / Bedrock -->
  <rect x="585" y="205" width="185" height="110" rx="10" fill="#1e0d45" stroke="#f97316" stroke-width="1.5"/>
  <text x="677" y="230" text-anchor="middle" fill="#fb923c" font-size="13" font-family="Arial" font-weight="bold">AI / Bedrock</text>
  <text x="677" y="248" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">AWS Bedrock</text>
  <text x="677" y="263" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">Lambda + AI Integration</text>
  <text x="677" y="278" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">ChatBot · Automation</text>
  <text x="677" y="293" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Arial">Gen AI Workloads</text>
  <!-- Experience stat banner -->
  <rect x="30" y="335" width="740" height="60" rx="12" fill="#0f0522" stroke="#7c3aed" stroke-width="1"/>
  <text x="130" y="360" text-anchor="middle" fill="#a78bfa" font-size="22" font-family="Arial" font-weight="bold">4+</text>
  <text x="130" y="380" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="Arial">Years XP</text>
  <line x1="200" y1="345" x2="200" y2="385" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  <text x="290" y="360" text-anchor="middle" fill="#a78bfa" font-size="22" font-family="Arial" font-weight="bold">8+</text>
  <text x="290" y="380" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="Arial">Projects</text>
  <line x1="360" y1="345" x2="360" y2="385" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  <text x="470" y="360" text-anchor="middle" fill="#a78bfa" font-size="22" font-family="Arial" font-weight="bold">50+</text>
  <text x="470" y="380" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="Arial">AWS Services Used</text>
  <line x1="560" y1="345" x2="560" y2="385" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
  <text x="650" y="360" text-anchor="middle" fill="#fb923c" font-size="22" font-family="Arial" font-weight="bold">99.9%</text>
  <text x="650" y="380" text-anchor="middle" fill="#fed7aa" font-size="10" font-family="Arial">Uptime Maintained</text>
  <!-- Footer -->
  <text x="400" y="428" text-anchor="middle" fill="#a78bfa" font-size="15" font-family="Arial" font-weight="bold" filter="url(#purpleGlow2)">Cloud Engineering Responsibilities</text>
  <text x="400" y="448" text-anchor="middle" fill="#7c3aed" font-size="11" font-family="Arial">AWS · Azure · DevOps · Security · Containers · Monitoring · AI</text>
  <text x="400" y="468" text-anchor="middle" fill="#3b0764" font-size="10" font-family="Arial">Senior CloudOps Engineer · BahwanCyberTek &amp; Aspire Systems</text>
</svg>
