<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#3d1a6e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9d423"/>
      <stop offset="100%" style="stop-color:#f4a307"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cbf"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="80" x2="800" y2="80" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#a78bfa" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="480" stroke="#a78bfa" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="480" stroke="#a78bfa" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="480" stroke="#a78bfa" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="480" stroke="#a78bfa" stroke-width="1"/>
  </g>
  <!-- AWS Cloud nodes -->
  <rect x="60" y="50" width="120" height="50" rx="10" fill="url(#purpleGrad)" opacity="0.85"/>
  <text x="120" y="80" text-anchor="middle" fill="white" font-size="13" font-family="Arial" font-weight="bold">EC2 / ALB</text>
  <rect x="340" y="50" width="120" height="50" rx="10" fill="url(#purpleGrad)" opacity="0.85"/>
  <text x="400" y="80" text-anchor="middle" fill="white" font-size="13" font-family="Arial" font-weight="bold">RDS Aurora</text>
  <rect x="620" y="50" width="120" height="50" rx="10" fill="url(#purpleGrad)" opacity="0.85"/>
  <text x="680" y="80" text-anchor="middle" fill="white" font-size="13" font-family="Arial" font-weight="bold">CloudFront</text>
  <!-- Connection lines -->
  <line x1="180" y1="75" x2="340" y2="75" stroke="#f9d423" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <line x1="460" y1="75" x2="620" y2="75" stroke="#f9d423" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>
  <!-- Main jewelry store card -->
  <rect x="160" y="140" width="480" height="280" rx="18" fill="#2a1060" stroke="#f9d423" stroke-width="2" opacity="0.95"/>
  <!-- Store top bar -->
  <rect x="160" y="140" width="480" height="55" rx="18" fill="url(#goldGrad)"/>
  <rect x="160" y="170" width="480" height="25" fill="url(#goldGrad)"/>
  <text x="400" y="175" text-anchor="middle" fill="#1a0533" font-size="15" font-family="Arial" font-weight="bold">Jewelry Store — AWS 3-Tier E-Commerce</text>
  <!-- Product cards -->
  <rect x="190" y="215" width="130" height="110" rx="10" fill="#3d1a6e"/>
  <text x="255" y="255" text-anchor="middle" fill="#f9d423" font-size="30">💎</text>
  <text x="255" y="285" text-anchor="middle" fill="white" font-size="11" font-family="Arial">Diamond Ring</text>
  <text x="255" y="305" text-anchor="middle" fill="#f9d423" font-size="12" font-family="Arial" font-weight="bold">₹45,000</text>
  <rect x="335" y="215" width="130" height="110" rx="10" fill="#3d1a6e"/>
  <text x="400" y="255" text-anchor="middle" fill="#f9d423" font-size="30">👑</text>
  <text x="400" y="285" text-anchor="middle" fill="white" font-size="11" font-family="Arial">Gold Necklace</text>
  <text x="400" y="305" text-anchor="middle" fill="#f9d423" font-size="12" font-family="Arial" font-weight="bold">₹82,000</text>
  <rect x="480" y="215" width="130" height="110" rx="10" fill="#3d1a6e"/>
  <text x="545" y="255" text-anchor="middle" fill="#f9d423" font-size="30">🪙</text>
  <text x="545" y="285" text-anchor="middle" fill="white" font-size="11" font-family="Arial">Silver Bangles</text>
  <text x="545" y="305" text-anchor="middle" fill="#f9d423" font-size="12" font-family="Arial" font-weight="bold">₹12,500</text>
  <!-- Bottom infra tags -->
  <rect x="185" y="345" width="90" height="28" rx="14" fill="#f9d423" opacity="0.2" stroke="#f9d423" stroke-width="1"/>
  <text x="230" y="364" text-anchor="middle" fill="#f9d423" font-size="11" font-family="Arial">S3 Static</text>
  <rect x="290" y="345" width="90" height="28" rx="14" fill="#f9d423" opacity="0.2" stroke="#f9d423" stroke-width="1"/>
  <text x="335" y="364" text-anchor="middle" fill="#f9d423" font-size="11" font-family="Arial">Route 53</text>
  <rect x="395" y="345" width="90" height="28" rx="14" fill="#f9d423" opacity="0.2" stroke="#f9d423" stroke-width="1"/>
  <text x="440" y="364" text-anchor="middle" fill="#f9d423" font-size="11" font-family="Arial">Auto Scaling</text>
  <rect x="500" y="345" width="90" height="28" rx="14" fill="#f9d423" opacity="0.2" stroke="#f9d423" stroke-width="1"/>
  <text x="545" y="364" text-anchor="middle" fill="#f9d423" font-size="11" font-family="Arial">WAF / ACM</text>
  <!-- Footer label -->
  <text x="400" y="395" text-anchor="middle" fill="#f9d423" font-size="16" font-family="Arial" font-weight="bold" filter="url(#glow)">E-Commerce Jewelry Store</text>
  <text x="400" y="418" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="Arial">AWS 3-Tier Architecture · High Availability · Auto Scaling</text>
  <text x="400" y="458" text-anchor="middle" fill="#7c5cbf" font-size="11" font-family="Arial">EC2 · ALB · RDS Aurora · CloudFront · S3 · Route53 · WAF</text>
</svg>
